[package]
name = "codexsun-windows"
version = "1.1.59"
description = "CODEXSUN Windows desktop host"
authors = ["CODEXSUN"]
edition = "2024"

[lib]
name = "codexsun_windows_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "codexsun-windows"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
