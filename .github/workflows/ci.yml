name: Repository checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Use the repository npm version
        run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run dependencies:check
      - run: npm run check
      - run: npm run test:docs
      - name: Verify diagnostic and site-content isolation
        run: node --import tsx --test devkits/zuno/api/src/modules/diagnostics/*.test.ts devkits/zuno/api/src/modules/watch/*.test.ts apps/sites/clients/runtime/content/content-store.test.mjs
      - name: Verify synthetic Sites build fixture
        run: node --import tsx --test tools/ci-sites-publication-fixture.test.ts
      - name: Prepare synthetic Sites publication for build verification only
        run: node --import tsx tools/ci-sites-publication-fixture.ts
      - run: npm run build
      - run: npm run dependencies:check
