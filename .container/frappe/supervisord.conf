[supervisord]
nodaemon=true
pidfile=/tmp/codexsun-frappe-supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
childlogdir=/tmp
[unix_http_server]
file=/tmp/codexsun-frappe-supervisor.sock
chmod=0700
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///tmp/codexsun-frappe-supervisor.sock

[program:backend]
command=/usr/local/bin/start.sh
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:frontend]
command=/usr/local/bin/nginx-entrypoint.sh
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:websocket]
command=node /home/frappe/frappe-bench/apps/frappe/socketio.js
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:queue-short]
command=bench worker --queue short,default
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:queue-long]
command=bench worker --queue long
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:scheduler]
command=bench schedule
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
