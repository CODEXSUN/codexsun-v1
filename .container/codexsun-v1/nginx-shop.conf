server {
  listen 80;
  client_header_buffer_size 16k;
  large_client_header_buffers 4 64k;
  proxy_buffer_size 64k;
  proxy_buffers 4 64k;
  proxy_busy_buffers_size 128k;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;
  location = /health { access_log off; return 200 "ok\n"; }
  location ^~ /api/platform/ { proxy_pass http://codexsun-api:${PLATFORM_API_PORT}/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /index.html { add_header Cache-Control "no-cache, max-age=0, must-revalidate" always; }
  location / { add_header Cache-Control "no-cache, max-age=0, must-revalidate" always; try_files $uri $uri/ /index.html; }
  location ^~ /assets/ { expires 1y; add_header Cache-Control "public, immutable" always; try_files $uri =404; }
}
