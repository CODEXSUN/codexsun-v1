map $http_upgrade $codexsun_connection_upgrade {
  default upgrade;
  '' close;
}
upstream codexsun_api {
  zone codexsun_api 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server codexsun-api:${PLATFORM_API_PORT} resolve;
}
server {
  listen 80;
  client_header_buffer_size 16k;
  large_client_header_buffers 4 64k;
  proxy_buffer_size 64k;
  proxy_buffers 4 64k;
  proxy_busy_buffers_size 128k;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header Permissions-Policy "unload=*" always;

  # Resolve Chatb on demand so the optional realtime profile may remain off.
  resolver 127.0.0.11 valid=30s ipv6=off;
  location = /api/chatb/realtime {
    set $realtime_enabled ${CODEXSUN_REALTIME_ENABLED};
    if ($realtime_enabled = 0) { return 503; }
    set $chatb_upstream codexsun-chatb:${CODEXSUN_CHATB_PORT};
    proxy_pass http://$chatb_upstream/chatb/realtime$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $codexsun_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
  location = /health { access_log off; return 200 "ok\n"; }
  # These DevKits own their /api prefix; preserve it at the upstream.
  location ~ ^/api/(data-migration|data-bridge)(/|$) {
    proxy_pass http://codexsun_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $codexsun_connection_upgrade;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ^~ /api/app/ { proxy_pass http://codexsun_api/; proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $codexsun_connection_upgrade;
    proxy_read_timeout 300s; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location ^~ /api/platform/ { proxy_pass http://codexsun_api/; proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $codexsun_connection_upgrade;
    proxy_read_timeout 300s; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location = / { add_header Cache-Control "no-cache, max-age=0, must-revalidate" always; add_header Permissions-Policy "unload=*" always; try_files /index.html =404; }
  location = /index.html { add_header Cache-Control "no-cache, max-age=0, must-revalidate" always; add_header Permissions-Policy "unload=*" always; }
  location = /app.html { add_header Cache-Control "no-cache, max-age=0, must-revalidate" always; add_header Permissions-Policy "unload=*" always; }
  location / { add_header Cache-Control "no-cache, max-age=0, must-revalidate" always; add_header Permissions-Policy "unload=*" always; try_files $uri $uri/ /app.html; }
  location ^~ /assets/ { expires 1y; add_header Cache-Control "public, immutable" always; try_files $uri =404; }
}
